networks:
  internal:
    driver: bridge
    internal: true
    # no/default parent
    ipam:
      config:
        - subnet: "172.18.0.0/25"
          ip_range: "172.18.0.0/25"
          # no gateway
  external:
    driver: bridge
    ipam:
      options:
        parent: ${EXTERNAL_NETWORK_INTERFACE:-eth0}
      config:
        - subnet: "172.18.0.128/25"
          ip_range: "172.18.0.128/25"

services:
  config-render:
    image: mshafer1/envsubst:envsubst_1@sha256:da65980ec6494cdd7b1c17c33abad7a6f0ff9d39795b4eb286a8fbbc36d25c79
    container_name: config-render
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./dnscrypt-proxy.toml:/config-in/dnscrypt-proxy.toml:ro
      - ./rendered_config/:/config-out/:rw
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - UPSTREAM_DNS=${UPSTREAM_DNS:-cloudflare-family}
    command: ["envsubst '$${UPSTREAM_DNS}' < /config-in/dnscrypt-proxy.toml > /config-out/dnscrypt-proxy.toml"]
    network_mode: none
  dnscrypt-proxy:
    image: mshafer1/dnscrypt-proxy:dnscrypt-proxy_2@sha256:ec93b99ea82d2b39f5509f7ac5cb8106cc50010cf102753fe2b2a5f1252484ea
    container_name: dnscrypt-proxy
    depends_on:
      config-render:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./rendered_config/dnscrypt-proxy.toml:/config/dnscrypt-proxy.toml:ro
    # not exposing ports outside of stack
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.5 # Specify the IP address so that it can only listen on the internal network and not be exposed to the outside world
  pihole:
    image: mshafer1/pihole:pihole_v6@sha256:b64ee09ea541b4a68fe996e3f5431867f0030a9ca1d04f0baaf405ab70b914de
    container_name: pihole
    env_file:
      - .env
    depends_on:
      config-render:
        condition: service_completed_successfully
      dnscrypt-proxy:
        condition: service_started
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: '${PIHOLE_WEBPASSWORD:?PIHOLE_WEBPASSWORD is not set}' # required
      FTLCONF_dns_listeningMode: 'ALL' # Allows any reachable client to send queries
      FTLCONF_dns_upstreams: '172.18.0.5#5053' # Specifies your container address and port
      PIHOLE_DNS_LOG_TO_FILE: 'true' # Enables logging of DNS queries to a file
      BIND_IP: ${BIND_IP:-127.0.0.1}
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      # after container start, run `docker compose exec pihole sh /usr/local/bin/configure-lists.sh`
      - './_pihole_initial_lists.sh:/usr/local/bin/configure-lists.sh:ro'
    ports:
      - "${BIND_IP:-127.0.0.1}:53:53/tcp"
      - "${BIND_IP:-127.0.0.1}:53:53/udp"
      - "${BIND_IP:-127.0.0.1}:67:67/udp"
      - "${BIND_IP:-127.0.0.1}:123:123/udp"
      - "${BIND_IP:-127.0.0.1}:${HTTP_PREFIX:-}80:80/tcp"
    networks:
      internal:
        ipv4_address: 172.18.0.6 # Specify the IP address for the pihole container on the internal network
      external:
