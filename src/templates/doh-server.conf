# /etc/dns-over-https/doh-server.conf

# Local port where doh-server will receive HTTP traffic from NGINX
listen = [
  "127.0.0.1:8053",
  "[::1]:8053"
]

# Path for browser DoH clients
path = "/dns-query"

# Upstream DNS: Point directly to Pi-hole's DNS service on port 53
upstream = [
  "172.19.0.6:53"
]

timeout = 10
tries = 3
verbose = false
