# /etc/nginx/sites-available/pihole

# 1. Catch HTTP traffic and redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pihole.local ${FQDN} default_server; # Replace with your domain or LAN IP

    return 301 https://$host$request_uri;
}

# 2. Unified TLS Frontend Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${FQDN};

    # SSL/TLS Certificate configurations
    ssl_certificate /etc/letsencrypt/live/${FQDN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${FQDN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- DOH PROXY CONFIGURATION ---
    # Intercepts DoH web traffic and forwards it cleanly to doh-server
    location /dns-query {
        proxy_pass http://127.0.0.1:8053;
        
        # Performance optimizations for HTTP/2 multiplexing streams
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Pass essential operational tracking headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep small packet sizes snappy
        client_max_body_size 10m;
        client_body_buffer_size 128k;
        
        # Recommended: Disable buffering to reduce latency on DNS round trips
        proxy_buffering off;
    }

    # --- PI-HOLE WEB FRONTEND PROXY ---
    # Catches all other requests (like /admin) and proxies to your Web UI
    location / {
        proxy_pass http://172.19.0.6:${HTTP_PREFIX}80;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard WebSocket handshake parameters for modern interface states
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
